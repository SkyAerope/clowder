name: build
# 推送 tag（v*）时额外把各平台二进制发布到 GitHub Release。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一 ref 的新提交取消旧的进行中构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 发布 Release 需要

jobs:
  # 1) 构建前端，产物供后续交叉编译复用（前端与目标平台无关，只需构建一次）
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读取 package.json 的 packageManager 字段锁定版本

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # 2) 交叉编译各平台二进制（modernc sqlite 为纯 Go，CGO_ENABLED=0 即可）
  # 注：clowder 是 Unix 守护进程（start/stop 依赖 POSIX 进程组 API），仅支持 linux/darwin。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # - { goos: darwin, goarch: amd64 }
          # - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 把前端产物放回 web/dist 供 //go:embed all:dist 使用
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="clowder-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags="-s -w" -o "dist/${out}" ./cmd/clowder
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: clowder-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14

      # 仅 tag 触发时发布到 Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
